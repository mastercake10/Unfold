name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', 'cpp/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'cpp/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write  # attach the APK to the release on tags

env:
  OPENCV_VERSION: 4.10.0
  EIGEN_VERSION: 3.4.0

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Cache OpenCV and Eigen
        id: deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-opencv-${{ env.OPENCV_VERSION }}-eigen-${{ env.EIGEN_VERSION }}

      - name: Download OpenCV Android SDK and Eigen
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p deps && cd deps
          curl -sSfL -o opencv.zip "https://github.com/opencv/opencv/releases/download/$OPENCV_VERSION/opencv-$OPENCV_VERSION-android-sdk.zip"
          unzip -q opencv.zip && rm opencv.zip
          curl -sSfL "https://gitlab.com/libeigen/eigen/-/archive/$EIGEN_VERSION/eigen-$EIGEN_VERSION.tar.gz" | tar xz

      # The release key signs every build, so each APK installs over the previous one. Without the
      # secrets (e.g. pull requests from forks) a throwaway debug key is used; releases refuse that.
      - name: Signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::RELEASE_KEYSTORE_B64 not set: refusing to publish a release with a throwaway key"
            exit 1
          else
            echo "::warning::RELEASE_KEYSTORE_B64 not set: APK signed with a throwaway debug key"
          fi

      - name: Build
        working-directory: android
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          opencv.dir=$GITHUB_WORKSPACE/deps/OpenCV-android-sdk/sdk/native/jni
          eigen.dir=$GITHUB_WORKSPACE/deps/eigen-$EIGEN_VERSION
          EOF
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Unfold-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Unfold-apk
          path: Unfold-*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Unfold-*.apk --generate-notes
